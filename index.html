<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juegos Clásicos & Más</title>
  <link rel="stylesheet" href="shared/main-styles.css">
</head>
<body>
  <div id="mainMenu">
    <h1>JUEGOS CLÁSICOS & MÁS</h1>

    <h2 class="section-title">🎮 Juegos</h2>
    <div class="game-grid">
      <button class="game-btn" onclick="location.href='games/pong/index.html'">
        <span class="game-title">PONG</span>
        <span class="game-desc">Juego clásico de ping pong</span>
      </button>
      <button class="game-btn" onclick="location.href='games/breakout/index.html'">
        <span class="game-title">BREAKOUT</span>
        <span class="game-desc">Rompe todos los bloques</span>
      </button>
      <button class="game-btn" onclick="location.href='games/minesweeper/index.html'">
        <span class="game-title">BUSCAMINAS</span>
        <span class="game-desc">Encuentra todas las minas</span>
      </button>
      <button class="game-btn" onclick="location.href='games/snake/index.html'">
        <span class="game-title">SNAKE</span>
        <span class="game-desc">Come y crece sin chocarte</span>
      </button>
    </div>

    <h2 class="section-title">✨ Más funcionalidades</h2>
    <div class="game-grid extras-grid">
      <button class="extra-btn" onclick="location.href='explanations.html'">
        <span class="game-title">📖 EXPLICACIONES</span>
        <span class="game-desc">Cómo se han hecho los juegos</span>
      </button>
      <button class="extra-btn" onclick="location.href='chat.html'">
        <span class="game-title">💬 CHAT</span>
        <span class="game-desc">Chat abierto y compartido</span>
      </button>
    </div>
  </div>
  <footer class="copilot-notice">
    <p>⚠️ Esta página se utiliza para realizar pruebas con el agente GitHub Copilot</p>
  </footer>
</body>
</html>
